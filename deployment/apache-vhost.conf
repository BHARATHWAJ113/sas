# Example only. Replace domain, paths, and certificate locations before enabling.
# Required modules: ssl, headers, rewrite, proxy, proxy_http.
<VirtualHost *:80>
    ServerName school.example.com
    Redirect permanent / https://school.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName school.example.com
    DocumentRoot /var/www/st-antonys/client/dist
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/school.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/school.example.com/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:4000/api/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/
    ProxyPass /sitemap.xml http://127.0.0.1:4000/api/sitemap.xml
    ProxyPassReverse /sitemap.xml http://127.0.0.1:4000/api/sitemap.xml
    LimitRequestBody 9437184
    <Directory /var/www/st-antonys/client/dist>
        AllowOverride FileInfo Options AuthConfig
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/st-antonys-error.log
    CustomLog ${APACHE_LOG_DIR}/st-antonys-access.log combined
</VirtualHost>
