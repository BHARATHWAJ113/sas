# Example only. Replace domain, paths, and certificate locations before enabling.
# Required modules: ssl, headers, rewrite, proxy, proxy_http.
<VirtualHost *:80>
    ServerName stantonysneyveli.in
    ServerAlias www.stantonysneyveli.in
    Redirect permanent / https://stantonysneyveli.in/
</VirtualHost>

<VirtualHost *:443>
    ServerName stantonysneyveli.in
    ServerAlias www.stantonysneyveli.in
    DocumentRoot /var/www/stantonysneyveli.in/live/client/dist
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/stantonysneyveli.in/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stantonysneyveli.in/privkey.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Forwarded-For
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api/ http://127.0.0.1:4000/api/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/
    # Compatibility for older database cover URLs; files still come from MinIO.
    ProxyPass /images/ http://127.0.0.1:4000/api/assets/images/
    ProxyPassReverse /images/ http://127.0.0.1:4000/api/assets/images/
    ProxyPass /sitemap.xml http://127.0.0.1:4000/api/sitemap.xml
    ProxyPassReverse /sitemap.xml http://127.0.0.1:4000/api/sitemap.xml
    LimitRequestBody 9437184
    <Directory /var/www/stantonysneyveli.in/live/client/dist>
        AllowOverride FileInfo Options AuthConfig
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/st-antonys-error.log
    CustomLog ${APACHE_LOG_DIR}/st-antonys-access.log combined
</VirtualHost>
